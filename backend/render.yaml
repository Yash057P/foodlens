services:
  - type: web
    name: foodlens-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    buildCommand: pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FOODLENS_MODEL_ID
        value: nateraw/food
      - key: FOODLENS_INFERENCE_PROVIDER
        value: hf_api
      - key: FOODLENS_CORS_ORIGINS
        value: https://foodlens.vercel.app,https://foodlens.vercel.app/
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"

# IMPORTANT: HF_TOKEN must be added manually in the Render service dashboard
# (Settings > Environment, it is a secret - never commit it here). Predictions are
# served by the Hugging Face hosted inference API for 'nateraw/food' (same model,
# free tier ~2,000 calls/month) so this service needs almost no memory.