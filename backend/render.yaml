services:
  - type: web
    name: foodlens-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    buildCommand: pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FOODLENS_MODEL_ID
        value: nateraw/food
      - key: FOODLENS_INFERENCE_PROVIDER
        value: hf_api
      - key: FOODLENS_CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FOODLENS_FALLBACK_ENABLED
        value: "false"
      - key: FOODLENS_GROQ_MODEL
        value: qwen/qwen3.8-27b

# IMPORTANT: Set these secrets manually in the Render dashboard (Settings > Environment):
# - HF_TOKEN          : Hugging Face token for hosted inference (~2,000 free calls/month)
# - GROQ_API_KEY      : (optional) Free Groq key from console.groq.com
#                         Enables a fallback vision call when the primary model confidence
#                         is low. Set FOODLENS_FALLBACK_ENABLED=true once the key is added.
# Neither secret must ever be committed to the repo.